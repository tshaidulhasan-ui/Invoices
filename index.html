<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Invoices">
<meta name="theme-color" content="#f5f5f7">
<title>Invoices</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#6e6e73;--ln:#e5e5ea;--ac:#1f4e79;--gr:#1e8e3e;--rd:#d93025;--am:#b06000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px}
h1{font-size:30px;margin:8px 0 6px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);margin:22px 4px 8px;font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.pad{padding:14px 16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:20px;margin-top:2px}.stat span{font-size:13px;color:var(--mu)}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-family:inherit;font-weight:600;font-size:16px;background:var(--ac);color:#fff;cursor:pointer}
.btn.sec{background:#e8eef5;color:var(--ac)}.btn.dan{background:#fdecea;color:var(--rd)}
.btn.full{width:100%}.btn.sm{padding:8px 12px;font-size:14px}
.link{background:none;border:0;color:var(--ac);font-family:inherit;font-size:16px;font-weight:600;padding:8px 0;cursor:pointer}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--ln)}
.field:first-child{border-top:0}
.field label{color:var(--mu);font-size:15px;white-space:nowrap}
.field input,.field select{border:0;background:none;font:inherit;text-align:right;color:var(--tx);min-width:0;flex:1;outline:none}
input:disabled,select:disabled{color:var(--mu);opacity:1}
.row{position:relative;overflow:hidden;border-top:1px solid var(--ln)}.row:first-child{border-top:0}
.rc{position:relative;z-index:2;background:var(--card);padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer}
.acts{position:absolute;top:0;bottom:0;display:flex;z-index:1}.acts.r{right:0}.acts.l{left:0}
.acts button{border:0;color:#fff;font-family:inherit;font-weight:600;font-size:13px;width:72px}
.a-share{background:#1f78d1}.a-copy{background:#8e8e93}.a-del{background:var(--rd)}.acts .a-paid{background:var(--gr);width:90px}
.sub{font-size:13px;color:var(--mu)}
.amt{font-weight:600;text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:3px}
.p-draft{background:#eee;color:#555}.p-sent{background:#e3eefa;color:#1f5fa8}.p-paid{background:#e6f4ea;color:var(--gr)}.p-over{background:#fdecea;color:var(--rd)}
.mhead{display:flex;justify-content:space-between;margin:22px 4px 8px;font-size:13px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs button{flex:1;border:0;background:none;padding:8px 0 10px;font-family:inherit;font-weight:600;font-size:12px;color:var(--mu)}
.tabs button.on{color:var(--ac)}
.tabs svg{display:block;margin:0 auto 2px;width:24px;height:24px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:11;border-radius:28px;padding:14px 20px;box-shadow:0 6px 18px rgba(31,78,121,.35)}
.day{border-top:1px solid var(--ln);padding:12px 16px}.day:first-child{border-top:0}
.dayh{display:flex;align-items:center;gap:10px}.dayh input{width:22px;height:22px;accent-color:var(--ac);flex:none}
.dayg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.dayg label{font-size:12px;color:var(--mu)}
.dayg input{width:100%;border:1px solid var(--ln);border-radius:8px;padding:7px 5px;font:inherit;font-size:15px;background:#fafafa;color:var(--tx)}
.tag{font-size:11px;font-weight:700;background:#fff4e5;color:var(--am);border-radius:6px;padding:2px 6px}
.banner{background:#fff4e5;color:#7a4300;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
.banner.blue{background:#e8eef5;color:#1f3f5f}
.seg{display:flex;background:#e9e9ee;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-family:inherit;font-weight:600;font-size:14px;color:var(--tx)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tot{display:flex;justify-content:space-between;padding:6px 16px}
.tot.big{font-weight:700;font-size:18px;border-top:1px solid var(--ln);padding-top:10px;margin-top:4px}
.lock{min-height:85vh;display:flex;flex-direction:column;justify-content:center;max-width:380px;margin:0 auto;padding:24px}
.pinin{width:100%;font-size:20px;letter-spacing:.25em;text-align:center;padding:13px;border:1px solid var(--ln);border-radius:12px;margin:6px 0;background:#fff;color:var(--tx)}
.pinin.rec{letter-spacing:.06em;font-size:17px}
.code{font:600 20px ui-monospace,Menlo,monospace;background:#fff;border-radius:12px;padding:16px;text-align:center;letter-spacing:.05em;margin:12px 0;-webkit-user-select:all;user-select:all}
.err{color:var(--rd);font-size:14px;min-height:22px;margin:4px 0}
.hist{font-size:13px;padding:10px 16px;border-top:1px solid var(--ln)}.hist:first-child{border-top:0}
.paper{background:#fff;border-radius:14px;padding:20px 14px;font-size:12px;margin-top:10px}
.paper h3{font-size:24px;margin:0}
.paper table{width:100%;border-collapse:collapse;margin:8px 0}
.paper th{background:#1f4e79;color:#fff;text-align:left;padding:5px;font-size:11px}
.paper td{padding:5px;border-bottom:1px solid var(--ln)}
.paper .num{text-align:right}.paper .pt{font-weight:700;font-size:14px;margin-top:14px}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<script>
'use strict';
/* ========== Setup & helpers ========== */
const $=s=>document.querySelector(s);
const app=$('#app'),tabs=$('#tabs');
const K={meta:'inv.meta',data:'inv.data',fails:'inv.fails'};
let KEY=null,S=null,E=null,VI=null,view='list',curFY=null,editFrom=null,unlockReason=null;
const te=new TextEncoder(),td=new TextDecoder();
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const clone=o=>JSON.parse(JSON.stringify(o));
const money=n=>(+n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ========== Dates ========== */
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>{const d=D(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const today=()=>iso(new Date());
const fy=s=>{const d=D(s);return d.getMonth()>=6?d.getFullYear():d.getFullYear()-1};
const fyLabel=y=>`FY ${y}\u2013${String(y+1).slice(2)}`;
const fmtD=s=>D(s).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
const dayName=s=>D(s).toLocaleDateString('en-AU',{weekday:'long'});
const t12=s=>{let[h,m]=s.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`};
const period=i=>`${D(i.weekStart).toLocaleDateString('en-AU',{day:'numeric',month:'short'})} - ${fmtD(addDays(i.weekStart,6))}`;
const shortRange=i=>`${D(i.weekStart).toLocaleDateString('en-AU',{day:'numeric',month:'short'})} \u2013 ${D(addDays(i.weekStart,6)).toLocaleDateString('en-AU',{day:'numeric',month:'short'})}`;
function rangeText(w){if(!w.length)return '';const a=D(w[0].date),b=D(w[w.length-1].date);const f=d=>`${d.toLocaleDateString('en-AU',{weekday:'long'})} ${d.getDate()}`;const my=b.toLocaleDateString('en-AU',{month:'long',year:'numeric'});return w.length===1?`${f(a)} ${my}`:`${f(a)} to ${f(b)} ${my}`}
function breakText(w){const b=[...new Set(w.map(d=>+d.breakMin))];return b.length===1&&b[0]>0?`Each day includes a ${b[0]}-minute unpaid lunch break.`:''}

/* ========== NSW public holidays (check against nsw.gov.au each year) ========== */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return iso(new Date(y,mo-1,da,12))}
function nthMon(y,mo,n){const d=new Date(y,mo,1,12);while(d.getDay()!==1)d.setDate(d.getDate()+1);d.setDate(d.getDate()+7*(n-1));return iso(d)}
const holCache={};
function holidays(y){if(holCache[y])return holCache[y];const h={},add=(s,n)=>h[s]=n;
 const sub=(s,n)=>{const w=D(s).getDay();add(s,n);if(w===6)add(addDays(s,2),n+' (additional day)');if(w===0)add(addDays(s,1),n+' (additional day)')};
 sub(`${y}-01-01`,"New Year's Day");sub(`${y}-01-26`,'Australia Day');
 const e=easter(y);add(addDays(e,-2),'Good Friday');add(addDays(e,-1),'Easter Saturday');add(e,'Easter Sunday');add(addDays(e,1),'Easter Monday');
 add(`${y}-04-25`,'Anzac Day');add(nthMon(y,5,2),"King's Birthday");add(nthMon(y,9,1),'Labour Day');
 const cw=D(`${y}-12-25`).getDay();add(`${y}-12-25`,'Christmas Day');add(`${y}-12-26`,'Boxing Day');
 if(cw===5)add(`${y}-12-28`,'Boxing Day (additional day)');
 if(cw===6){add(`${y}-12-27`,'Christmas (additional day)');add(`${y}-12-28`,'Boxing Day (additional day)')}
 if(cw===0)add(`${y}-12-27`,'Christmas (additional day)');
 return holCache[y]=h}
const holName=s=>holidays(D(s).getFullYear())[s];

/* ========== Encryption ========== */
function b64(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(secret,salt){const base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function aesEnc(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return{iv:b64(iv),ct:b64(ct)}}
async function aesDec(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)))}
const importData=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
const getMeta=()=>JSON.parse(localStorage.getItem(K.meta));
function makeRecovery(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=crypto.getRandomValues(new Uint8Array(20));let s='';r.forEach((x,i)=>{s+=A[x%32];if(i%5===4&&i<19)s+='-'});return s}
const normRec=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
async function wrapPin(meta,raw,pin){const s=crypto.getRandomValues(new Uint8Array(16));meta.saltPin=b64(s);meta.wPin=await aesEnc(await deriveKey(pin,s),raw)}
async function save(){localStorage.setItem(K.data,JSON.stringify(await aesEnc(KEY,te.encode(JSON.stringify(S)))))}
function blankState(){return{v:1,settings:{name:'',abn:'',address:'',phone:'',email:'',bank:'',accName:'',bsb:'',accNo:'',service:'Subcontract Electrical Service',rate:53,start:'07:00',finish:'15:30',breakMin:30,terms:7,gst:false,lastBackup:''},clients:[],invoices:[],log:[]}}
async function openWith(raw){KEY=await importData(raw);const d=localStorage.getItem(K.data);const st=d?JSON.parse(td.decode(await aesDec(KEY,JSON.parse(d)))):blankState();const b=blankState();S=Object.assign(b,st);S.settings=Object.assign(blankState().settings,st.settings||{})}
function addLog(text){S.log.unshift({ts:Date.now(),text});S.log=S.log.slice(0,1000)}

/* ========== Wrong-PIN delay ========== */
const failState=()=>JSON.parse(localStorage.getItem(K.fails)||'{"n":0,"until":0}');
const waitSecs=()=>Math.max(0,Math.ceil((failState().until-Date.now())/1000));
function fail(){const f=failState();f.n++;if(f.n>=3)f.until=Date.now()+Math.min(300,5*2**(f.n-3))*1000;localStorage.setItem(K.fails,JSON.stringify(f))}
const okFails=()=>localStorage.removeItem(K.fails);

/* ========== Lock screens ========== */
const isApp=()=>window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
function installBanner(){return isApp()?'':`<div class="banner blue">For the full app: tap <b>Share</b> \u2192 <b>Add to Home Screen</b>, then always open it from that icon. Safari and the home-screen app keep separate records.</div>`}
function renderLock(mode){tabs.hidden=true;const has=!!localStorage.getItem(K.meta);mode=mode||(has?'unlock':'welcome');
 if(mode==='welcome')app.innerHTML=`<div class="lock"><h1>Invoices</h1>${installBanner()}<p class="sub">Your records are stored only on this phone and encrypted with your PIN. Choose a PIN of at least 6 digits.</p>
  <input id="p1" class="pinin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="New PIN">
  <input id="p2" class="pinin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="Confirm PIN">
  <div class="err" id="er"></div><button class="btn full" onclick="doSetup()">Create PIN</button>
  <button class="link" style="margin-top:12px" onclick="restorePick()">Restore from a backup file</button></div>`;
 else if(mode==='unlock'){app.innerHTML=`<div class="lock"><h1>Invoices</h1><p class="sub">Enter your PIN to unlock your records.</p>
  <input id="pin" class="pinin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" onkeydown="if(event.key==='Enter')doUnlock()">
  <div class="err" id="er">${waitSecs()?`Too many attempts. Wait ${waitSecs()}s.`:''}</div><button class="btn full" onclick="doUnlock()">Unlock</button>
  <button class="link" style="margin-top:12px" onclick="renderLock('recover')">Forgot PIN? Use recovery code</button></div>`;setTimeout(()=>$('#pin')&&$('#pin').focus(),300)}
 else app.innerHTML=`<div class="lock"><h1>Reset PIN</h1><p class="sub">Enter your recovery code, then choose a new PIN.</p>
  <input id="rc" class="pinin rec" autocapitalize="characters" autocomplete="off" placeholder="XXXXX-XXXXX-XXXXX-XXXXX">
  <input id="p1" class="pinin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="New PIN">
  <input id="p2" class="pinin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="Confirm new PIN">
  <div class="err" id="er"></div><button class="btn full" onclick="doRecover()">Reset PIN</button>
  <button class="link" style="margin-top:12px" onclick="renderLock('unlock')">Back</button></div>`}
async function doSetup(){const a=$('#p1').value,b=$('#p2').value,er=$('#er');
 if(!/^\d{6,}$/.test(a))return er.textContent='PIN must be at least 6 digits.';
 if(a!==b)return er.textContent='PINs do not match.';
 er.textContent='Setting up encryption\u2026';
 const raw=crypto.getRandomValues(new Uint8Array(32)),rec=makeRecovery(),meta={v:1};
 await wrapPin(meta,raw,a);const s2=crypto.getRandomValues(new Uint8Array(16));meta.saltRec=b64(s2);meta.wRec=await aesEnc(await deriveKey(normRec(rec),s2),raw);
 localStorage.setItem(K.meta,JSON.stringify(meta));
 KEY=await importData(raw);S=blankState();addLog('PIN created, records encrypted');await save();
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 showRecovery(rec)}
function showRecovery(rec){const body=encodeURIComponent(`Invoices app recovery code:\n\n${rec}\n\nKeep this safe. It unlocks your records if you forget your PIN.`);
 app.innerHTML=`<div class="lock"><h1>Recovery code</h1><p class="sub">If you forget your PIN, this code is the only way back into your records. Nobody else can recover them.</p><div class="code">${rec}</div>
 <a class="btn sec full" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px" href="mailto:?subject=${encodeURIComponent('Invoices app recovery code')}&body=${body}">Email it to myself</a>
 <label class="sub" style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="ok" style="width:20px;height:20px"> I've saved my recovery code</label>
 <button class="btn full" onclick="if($('#ok').checked){go('settings')}else alert('Please save your recovery code first.')">Continue</button></div>`}
async function doUnlock(){const er=$('#er'),w=waitSecs();if(w)return er.textContent=`Too many attempts. Wait ${w}s.`;
 const pin=$('#pin').value;er.textContent='Unlocking\u2026';
 try{const m=getMeta();const raw=await aesDec(await deriveKey(pin,unb64(m.saltPin)),m.wPin);await openWith(raw);okFails();addLog('Unlocked');await save();go('list')}
 catch(e){fail();const w2=waitSecs();er.textContent='Wrong PIN.'+(w2?` Wait ${w2}s before trying again.`:'');$('#pin').value=''}}
async function doRecover(){const er=$('#er'),w=waitSecs();if(w)return er.textContent=`Too many attempts. Wait ${w}s.`;
 const rec=$('#rc').value,a=$('#p1').value,b=$('#p2').value;
 if(!/^\d{6,}$/.test(a))return er.textContent='New PIN must be at least 6 digits.';if(a!==b)return er.textContent='PINs do not match.';
 er.textContent='Checking\u2026';
 try{const m=getMeta();const raw=await aesDec(await deriveKey(normRec(rec),unb64(m.saltRec)),m.wRec);await wrapPin(m,raw,a);localStorage.setItem(K.meta,JSON.stringify(m));await openWith(raw);okFails();addLog('PIN reset with recovery code');await save();go('list')}
 catch(e){fail();er.textContent='Recovery code not recognised.'}}
async function changePin(){const cur=$('#cp0').value,n1=$('#cp1').value,n2=$('#cp2').value;
 if(!/^\d{6,}$/.test(n1))return alert('New PIN must be at least 6 digits.');if(n1!==n2)return alert('New PINs do not match.');
 try{const m=getMeta();const raw=await aesDec(await deriveKey(cur,unb64(m.saltPin)),m.wPin);await wrapPin(m,raw,n1);localStorage.setItem(K.meta,JSON.stringify(m));addLog('PIN changed');await save();alert('PIN changed.');render()}
 catch(e){alert('Current PIN is wrong.')}}
function lock(){KEY=null;S=null;E=null;VI=null;view='list';renderLock()}
let hiddenAt=0,idleT=null;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(KEY&&Date.now()-hiddenAt>30000)lock()});
function resetIdle(){clearTimeout(idleT);if(KEY)idleT=setTimeout(lock,5*60000)}
['touchstart','keydown','click'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));

/* ========== Backup & restore (file stays encrypted) ========== */
async function backup(){const b=JSON.stringify({app:'invoices',v:1,at:new Date().toISOString(),meta:getMeta(),data:JSON.parse(localStorage.getItem(K.data))});
 const name=`invoices-backup-${today()}.json`,file=new File([b],name,{type:'application/json'});
 const done=async()=>{S.settings.lastBackup=today();addLog('Backup created');await save();render()};
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});await done()}catch(e){}}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();await done()}}
function restorePick(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=async()=>{try{const o=JSON.parse(await inp.files[0].text());if(o.app!=='invoices'||!o.meta||!o.data)throw 0;
  if(!confirm('Replace ALL records on this phone with this backup? You will need the PIN (or recovery code) that was in use when the backup was made.'))return;
  localStorage.setItem(K.meta,JSON.stringify(o.meta));localStorage.setItem(K.data,JSON.stringify(o.data));okFails();lock()}
  catch(e){alert('That file is not a valid backup.')}};inp.click()}

/* ========== Invoice logic ========== */
const live=()=>S.invoices.filter(i=>!i.deleted);
const find=id=>S.invoices.find(i=>i.id===id);

 y=doc.lastAutoTable.finalY+9;head('Hours Worked');
 doc.autoTable({...common,startY:y,head:[['Day','Date','Start','Finish','Hours','Rate ($/hr)','Amount ($)']],body:w.map(d=>[dayName(d.date),fmtD(d.date),t12(d.start),t12(d.finish),hrs(d).toFixed(1),money(d.rate),money(amt(d))]),foot:[['Total','','','',t.hours.toFixed(1),'',money(t.sub)]],footStyles:{fillColor:[242,242,247],textColor:20,fontStyle:'bold'},columnStyles:{4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}}});
 y=doc.lastAutoTable.finalY+6;const bt=breakText(w);if(bt){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...grey);doc.text(bt,L,y);doc.setTextColor(0);y+=4}
 doc.autoTable({...common,startY:y,margin:{left:115,right:L},head:[['','Amount ($)']],body:[['Subtotal',money(t.sub)],['GST',money(t.gst)]],foot:[['Total Due',money(t.total)]],footStyles:{fillColor:[242,242,247],textColor:20,fontStyle:'bold'},columnStyles:{1:{halign:'right'}}});
 y=doc.lastAutoTable.finalY+9;head('Payment Details');doc.setFont('helvetica','normal');doc.setFontSize(10);y+=3;
 doc.text(`Please pay by bank transfer within ${+st.terms||7} days, using the invoice number as the reference.`,L,y,{maxWidth:R-L});y+=4;
 doc.autoTable({...common,startY:y,head:[['Bank','Account Name','BSB','Account No.']],body:[[st.bank||'',st.accName||'',st.bsb||'',st.accNo||'']]});
 y=doc.lastAutoTable.finalY+8;doc.setFontSize(10);if(!i.gst){doc.text('No GST has been charged - the supplier is not registered for GST.',L,y);y+=6}
 doc.text('Thank you for your business.',L,y);return doc}
async function sharePDF(i){if(!window.jspdf){alert('The PDF tool could not load. Check your internet connection and try again.');return}
 const blob=buildPDF(i).output('blob'),name=`${i.number||'invoice'}.pdf`,file=new File([blob],name,{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name})}catch(e){}}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
 if(view==='list')render()}

/* ========== Settings ========== */
async function setS(k,v){if(typeof v==='number'&&isNaN(v))return;if(S.settings[k]===v)return;S.settings[k]=v;addLog(`Setting changed: ${k}`);await save()}
async function editClient(id){const c=id?S.clients.find(x=>x.id===id):{id:uid(),name:'',abn:'',address:''};
 const name=prompt('Client name',c.name);if(name==null)return;if(!name.trim())return alert('Name is required.');
 const abn=prompt('Client ABN (optional)',c.abn);if(abn==null)return;
 const address=prompt('Client address (optional)',c.address);if(address==null)return;
 Object.assign(c,{name:name.trim(),abn:abn.trim(),address:address.trim()});if(!id)S.clients.push(c);
 addLog(`Client ${id?'updated':'added'}: ${c.name}`);await save();render()}
function renderSettings(){const s=S.settings;
 const F=(k,l,type='text',extra='')=>`<div class="field"><label>${l}</label><input type="${type}" ${extra} value="${esc(s[k])}" onchange="setS('${k}',this.${type==='number'?'valueAsNumber':'value'})"></div>`;
 const delList=S.invoices.filter(i=>i.deleted);
 app.innerHTML=`<div class="wrap"><div class="top"><h1>Settings</h1><button class="link" onclick="lock()">Lock</button></div>
 <h2>Your business</h2><div class="card">${F('name','Name')}${F('abn','ABN','text','inputmode="numeric"')}${F('address','Address')}${F('phone','Phone','tel')}${F('email','Email','email')}</div>
 <h2>Bank details</h2><div class="card">${F('bank','Bank')}${F('accName','Account name')}${F('bsb','BSB','text','inputmode="numeric"')}${F('accNo','Account no.','text','inputmode="numeric"')}</div>
 <h2>Invoice defaults</h2><div class="card">${F('service','Service')}${F('rate','Hourly rate ($)','number','step="0.01" inputmode="decimal"')}${F('start','Start time','time')}${F('finish','Finish time','time')}${F('breakMin','Unpaid break (min)','number','inputmode="numeric"')}${F('terms','Payment terms (days)','number','inputmode="numeric"')}
 <div class="field"><label>Registered for GST</label><input type="checkbox" style="flex:none;width:22px;height:22px" ${s.gst?'checked':''} onchange="setS('gst',this.checked)"></div></div>
 <h2>Clients</h2><div class="card">${S.clients.map(c=>`<div class="rc" style="border-bottom:1px solid var(--ln)" onclick="editClient('${c.id}')"><div><b>${esc(c.name)}</b><div class="sub">${c.abn?'ABN '+esc(c.abn):''} ${esc(c.address||'')}</div></div><span class="sub">Edit \u203a</span></div>`).join('')}<div class="pad"><button class="btn sm sec" onclick="editClient()">+ Add client</button></div></div>
 <h2>Backup</h2><div class="card"><div class="pad"><p class="sub" style="margin-top:0">Creates an encrypted backup file. Choose <b>Google Drive</b> (or Save to Files) in the share sheet. It can only be opened with your PIN or recovery code.</p>
 <p class="sub">Last backup: <b>${s.lastBackup?fmtD(s.lastBackup):'never'}</b></p><button class="btn sm" onclick="backup()">Back up now</button> <button class="btn sm sec" onclick="restorePick()">Restore</button></div></div>
 <h2>Security</h2><div class="card"><div class="pad"><div class="sub" style="margin-bottom:6px">Change PIN</div>
 <input id="cp0" class="pinin" type="password" inputmode="numeric" placeholder="Current PIN"><input id="cp1" class="pinin" type="password" inputmode="numeric" placeholder="New PIN (6+ digits)"><input id="cp2" class="pinin" type="password" inputmode="numeric" placeholder="Confirm new PIN">
 <button class="btn sm" style="margin-top:6px" onclick="changePin()">Change PIN</button></div>
 <div class="field" style="cursor:pointer" onclick="go('log')"><label style="color:var(--tx)">Activity log</label><span class="sub">\u203a</span></div></div>
 <p class="sub" style="margin:8px 4px">Records are encrypted on this phone with your PIN. The app locks after 5 minutes without use, or 30 seconds after you leave it.</p>
 ${delList.length?`<h2>Recently deleted</h2><div class="card">${delList.map(i=>`<div class="field"><label style="color:var(--tx)">${esc(i.number)} \u00b7 $${money(totals(i).total)}</label><button class="link" onclick="restore('${i.id}')">Restore</button></div>`).join('')}</div>`:''}
 </div>`}
function renderLog(){app.innerHTML=`<div class="wrap"><div class="top"><button class="link" onclick="go('settings')">\u2039 Settings</button><b>Activity log</b><span style="width:60px"></span></div>
 <div class="card" style="margin-top:12px">${S.log.map(l=>`<div class="hist"><span class="sub">${new Date(l.ts).toLocaleString('en-AU')}</span><br>${esc(l.text)}</div>`).join('')||'<div class="empty">No activity yet.</div>'}</div></div>`}

renderLock();
</script>
